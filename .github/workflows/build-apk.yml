name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi dan buat proyek Android
        working-directory: web
        run: |
          npm install
          npx cap add android
          sed -i 's|<activity|<activity android:screenOrientation="landscape"|' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Bangun APK
        working-directory: web/android
        run: ./gradlew assembleDebug

      - name: Salin APK
        run: cp web/android/app/build/outputs/apk/debug/app-debug.apk pool8.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pool8-apk
          path: pool8.apk

      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Biliar 8 build ${{ github.run_number }}
          files: pool8.apk
